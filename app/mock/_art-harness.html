<!doctype html>
<html lang="en">
<head>
<base href="/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>ART harness (Doré engravings)</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/art.css">
<style>
  /* harness-only: a compact control strip in the bar */
  .h-note { font-size: 12px; color: var(--label-3); white-space: nowrap; }
  .gnav-right .pill-tog { height: 30px; }
</style>
</head>
<body>
<a class="skip" href="#reader">Skip to the text</a>

<!-- Mirrors index.html / reader.js / drawer.js markup closely enough to exercise art.js the way
     reader.js (heroHtml, verseBadgeHtml, attachReader), drawer.js (drawerHtml, attachDrawer) and
     main.js (renderGallery / stop, showPanel('art')) call it. No writes: nothing here saves. -->
<header id="topbar" class="gnav flat">
  <div class="gnav-left">
    <label class="pill-select" title="Chapter"><span class="sr">Chapter</span><select id="h-ch"></select><svg class="i chev" aria-hidden="true"><use href="#i-chev-down"/></svg></label>
    <span class="pair">
      <button id="btn-prev" class="ib" type="button" aria-label="Previous chapter" title="Previous chapter"><svg class="i" aria-hidden="true"><use href="#i-chev-left"/></svg></button>
      <button id="btn-next" class="ib" type="button" aria-label="Next chapter" title="Next chapter"><svg class="i" aria-hidden="true"><use href="#i-chev-right"/></svg></button>
    </span>
  </div>
  <div></div>
  <div class="gnav-right">
    <button class="pill-tog" type="button" id="h-gallery" aria-pressed="false">Gallery</button>
    <button class="pill-tog" type="button" id="h-drawer" aria-pressed="false">Sheet</button>
    <button class="pill-tog" type="button" id="h-float" aria-pressed="true">Floating</button>
    <button class="pill-tog" type="button" id="h-place" aria-pressed="false" title="Put the badge inside .badges (else after it in .vmeta)">In .badges</button>
    <button class="pill-tog" type="button" id="h-notes" aria-pressed="false" title="Fake note badges on the art verses">Notes</button>
    <button class="pill-tog txt" type="button" id="h-theme">Theme: auto</button>
  </div>
  <div id="progress" aria-hidden="true"></div>
</header>

<div class="page" id="page">
  <section id="panel" aria-labelledby="stage-title" aria-hidden="true" inert><div class="stage-clip"><div class="stage" id="stage"></div></div></section>
  <main id="layout"><section id="reader" class="reader" tabindex="-1" aria-label="Chapter text"></section></main>
</div>

<div class="scrim" id="scrim" aria-hidden="true"></div>
<aside id="drawer" class="drawer" role="dialog" aria-labelledby="drawer-title" aria-modal="false" aria-hidden="true" inert>
  <button class="grabber" id="grabber" type="button" aria-label="Expand study sheet"></button>
  <header class="sheet-top" id="sheet-top">
    <div class="sheet-head">
      <div class="sheet-title"><p class="sheet-kicker" id="drawer-kicker"></p><h2 id="drawer-title" tabindex="-1">John 3</h2><p id="drawer-sub">Context</p></div>
      <button id="drawer-close" class="close-btn" type="button" aria-label="Close study panel" title="Close (Esc)"><svg class="i" aria-hidden="true"><use href="#i-xmark"/></svg></button>
    </div>
  </header>
  <div id="drawer-body" class="sheet-body" role="tabpanel" tabindex="-1"></div>
</aside>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module">
import { icon } from './js/icons.js';
import { state, data, bookOf, refLabel, esc, layoutMode, onLayoutChange, divSlug, testamentName, RM } from './js/store.js';
import * as art from './js/art.js';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const LOG = (window.__log = []);
const log = (...a) => { LOG.push(a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' ')); };
const TEST = [[1, 22], [2, 14], [27, 6], [42, 15], [44, 9], [66, 21], [40, 27], [1, 1], [45, 8], [7, 16], [43, 6]];
const H = { place: 'after', notes: false };

// ------------------------------------------------------------ mock action object (main.js A)
const A = {
  navigate(b, c, v = 0, opts = {}) {
    log('navigate', b, c, v, opts);
    state.book = b; state.chapter = c; state.selected = v || null;
    if (opts.panel) state.panel = opts.panel;
    renderReader({ scroll: opts.panel ? 'top' : true });
    renderDrawer(); renderPanel(); updateBar();
  },
  select(v, o = {}) {
    log('select', v, o);
    state.selected = +v; updateSelection();
    if (o.open !== false && !state.drawerOpen) openDrawer(); else renderDrawer();
    ensureVisible(+v);
  },
  flash(list, o = {}) {
    log('flash', list, o);
    $$('#reader .verse.flash').forEach(e => e.classList.remove('flash'));
    const els = list.map(v => document.getElementById('v' + v)).filter(Boolean);
    if (!els.length) return; void els[0].offsetWidth; els.forEach(e => e.classList.add('flash'));
    if (o.scroll !== false) ensureVisible(els[0]);
  },
  toast(msg, action) { log('toast', msg); toast(msg, action); },
  showPanel(p, force = false) { log('showPanel', p, force); state.panel = force ? p : (state.panel === p ? null : p); renderPanel(); },
  openTab() {}, openDrawer() { openDrawer(); }, closeDrawer() { closeDrawer(); }, yieldToPage() {},
};
window.__A = A; window.__art = art; window.__state = state;

// ------------------------------------------------------------ reader (mirrors reader.js markup)
let renderP = Promise.resolve();
function renderReader(opts = {}) { renderP = renderChapter(opts); return renderP; }
async function renderChapter(opts) {
  const el = $('#reader'); const b = state.book, c = state.chapter, bk = bookOf(b);
  const [bible, xr] = await Promise.all([data.bible('kjv', b), data.xref(b).catch(() => ({})), art.load()]);
  if (b !== state.book || c !== state.chapter) return;
  const verses = bible[c] || [];
  const fresh = el.dataset.ch !== `${b}.${c}`;
  let html = `<header class="hero${fresh ? ' enter' : ''}" data-div="${esc(divSlug(bk))}">
    <p class="eyebrow"><span class="t-dot ${bk.test === 'OT' ? 'ot' : 'nt'}" aria-hidden="true"></span>${esc(testamentName(bk))} · ${esc(bk.div)}</p>
    <h1 class="hero-title">${esc(bk.name === 'Psalms' ? 'Psalm' : bk.name)} <span class="chnum">${c}</span></h1>
    <div class="chips" role="group" aria-label="This chapter at a glance"><button class="chip" type="button" data-tab="xref">${icon('link')}<span><b>${(bk.xo[c] || 0).toLocaleString()}</b> links</span></button><button class="chip more" type="button" data-tab="context">About ${esc(bk.name)}${icon('chev-right')}</button></div>
    ${art.heroHtml(b, c)}
    <figure class="sig"><div class="arc-host" id="sig-arcs" style="height:120px;display:grid;place-items:center;color:var(--label-4);font-size:13px">signature arcs (viz) placeholder</div></figure>
  </header>`;
  html += `<div class="verses" role="list" lang="en">`;
  const roving = state.selected || 1;
  for (let v = 1; v <= verses.length; v++) {
    const xc = (xr[`${c}:${v}`] || []).length;
    const badge = art.verseBadgeHtml(b, c, v);
    const note = H.notes && badge ? `<span class="b-note" title="Has a note">${icon('note')}<span class="sr">Has a note</span></span><span class="b-tag" title="#tag">${icon('tag')}<span class="sr">Tags</span></span>` : '';
    const inside = H.place === 'in';
    const meta = `<span class="vmeta">${xc ? `<button class="xc" type="button" data-v="${v}" tabindex="-1" aria-label="${xc} cross-references" title="${xc} cross-references">${icon('link')}${xc}</button>` : ''}<span class="badges">${note}${inside ? badge : ''}</span>${inside ? '' : badge}</span>`;
    html += `<div class="verse" id="v${v}" data-v="${v}" role="listitem" tabindex="${v === roving ? 0 : -1}"${state.selected === v ? ' aria-current="true"' : ''}><span class="vnum"><span>${v}</span></span><span class="vtext">${esc(verses[v - 1] || '')}</span>${meta}</div>`;
  }
  html += `</div><nav class="foot-nav" aria-label="Chapters"><button class="foot-tile prev" type="button" data-nav="-1"><small>Previous</small><span>${icon('arrow-left')}Previous</span></button><button class="foot-tile next" type="button" data-nav="1"><small>Next</small><span>Next${icon('arrow-right')}</span></button></nav><p class="copyright">King James Version · Public domain</p>`;
  el.innerHTML = html; el.dataset.ch = `${b}.${c}`;
  art.attachReader(el, b, c);                        // reader.js contract: after every chapter render
  if (opts.scroll === 'top') scrollTo({ top: 0 });
  else if (opts.scroll) { const s = state.selected && document.getElementById('v' + state.selected); if (s) ensureVisible(s, true); else scrollTo({ top: 0 }); }
}
function updateSelection() {
  $$('#reader .verse[aria-current]').forEach(e => e.removeAttribute('aria-current'));
  const el = state.selected && document.getElementById('v' + state.selected);
  if (el) { el.setAttribute('aria-current', 'true'); $$('#reader .verse[tabindex="0"]').forEach(x => x.tabIndex = -1); el.tabIndex = 0; }
}
function ensureVisible(t, instant = false) {
  const el = typeof t === 'number' ? document.getElementById('v' + t) : t; if (!el) return;
  const top = $('#topbar').getBoundingClientRect().bottom + 12;
  const sheet = layoutMode() === 'sheet' && state.drawerOpen;
  const bottom = sheet ? $('#drawer').offsetTop - 12 : innerHeight - 16;
  const r = el.getBoundingClientRect(); if (r.top >= top && r.bottom <= bottom && !instant) return;
  const dy = sheet ? r.top - top - 8 : r.top - (top + bottom) / 2 + Math.min(r.height, bottom - top) / 2;
  scrollBy({ top: dy, behavior: instant || RM.matches ? 'auto' : 'smooth' });
}
$('#reader').addEventListener('click', e => {            // reader.js bindReader (bubble phase)
  const t = e.target;
  const nav = t.closest('[data-nav]'); if (nav) { step(+nav.dataset.nav); return; }
  const xc = t.closest('.xc'); if (xc) { A.select(+xc.dataset.v); return; }
  const v = t.closest('.verse'); if (v) { log('reader-click verse', +v.dataset.v); A.select(+v.dataset.v); }
});

// ------------------------------------------------------------ sheet (subset of main.js syncDrawer)
function syncDrawer() {
  const d = $('#drawer'), m = layoutMode(), open = !!state.drawerOpen, body = document.body;
  ['side', 'overlay', 'sheet'].forEach(x => body.classList.toggle('mode-' + x, x === m));
  d.classList.toggle('open', open); d.inert = !open; d.setAttribute('aria-hidden', String(!open));
  body.classList.toggle('drawer-open', open);
  const modal = open && m === 'overlay';
  body.classList.toggle('sheet-modal', modal);
  $('#page').inert = modal; $('#topbar').inert = modal;
  $('#h-drawer').setAttribute('aria-pressed', String(open));
}
function openDrawer() { state.drawerOpen = true; syncDrawer(); renderDrawer(); }
function closeDrawer() { state.drawerOpen = false; syncDrawer(); }
function renderDrawer() {
  const b = state.book, c = state.chapter, v = state.selected;
  $('#drawer-kicker').textContent = v ? `Verse ${v}` : bookOf(b).name;
  $('#drawer-title').textContent = refLabel(b, c, v);
  if (!state.drawerOpen) return;
  const body = $('#drawer-body');
  body.innerHTML = `<div class="view">${art.drawerHtml(b, c, v)}<div class="lh"><h3>Timeline</h3><span>placeholder</span></div><div class="empty"><p>The rest of the Context tab (drawer.js) goes here.</p></div></div>`;
  art.attachDrawer(body);                            // drawer.js contract: after every Context render
}
$('#drawer-close').addEventListener('click', closeDrawer);
$('#scrim').addEventListener('click', closeDrawer);
onLayoutChange(syncDrawer);

// ------------------------------------------------------------ stage (main.js renderPanel for 'art')
let clearT = 0;
function renderPanel() {
  const p = $('#panel'), st = $('#stage'), on = state.panel === 'art';
  p.classList.toggle('open', on); p.inert = !on; p.setAttribute('aria-hidden', String(!on));
  document.body.classList.toggle('panel-open', on);
  $('#h-gallery').setAttribute('aria-pressed', String(on));
  art.stop();
  clearTimeout(clearT);
  if (!on) { clearT = setTimeout(() => { if (!state.panel) st.innerHTML = ''; }, 560); return; }
  art.renderGallery(st);
}
$('#stage').addEventListener('click', e => { if (e.target.closest('[data-close-panel]')) A.showPanel('art'); });

// ------------------------------------------------------------ bar, toast, keys
function updateBar() { const s = $('#h-ch'); const k = `${state.book}.${state.chapter}`; if (![...s.options].some(o => o.value === k)) s.add(new Option(refLabel(state.book, state.chapter), k)); s.value = k; document.title = `${refLabel(state.book, state.chapter, state.selected)} · ART harness`; }
function step(d) { let b = state.book, c = state.chapter + d; if (c < 1) { if (b === 1) return; b--; c = bookOf(b).chapters.length; } if (c > bookOf(b).chapters.length) { if (b === 66) return; b++; c = 1; } A.navigate(b, c, 0); }
let toastT = 0, toastAct = null;
function toast(msg, action) {
  const t = $('#toast'); clearTimeout(toastT); toastAct = action || null;
  t.innerHTML = `<span class="toast-msg">${esc(msg)}</span>${action ? `<button type="button" class="toast-act">${esc(action.label || 'Undo')}</button>` : ''}`;
  t.hidden = false; t.classList.remove('out');
  toastT = setTimeout(() => { t.classList.add('out'); setTimeout(() => { t.hidden = true; t.classList.remove('out'); }, 300); }, action ? 6000 : 4200);
}
$('#toast').addEventListener('click', e => { if (e.target.closest('.toast-act')) { const a = toastAct; toastAct = null; $('#toast').hidden = true; a?.run?.(); } });
document.addEventListener('keydown', e => {                // main.js: ignores keys while a dialog is open
  if (e.target.matches?.('input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.querySelector('dialog[open]')) return;
  if (e.key === 'ArrowLeft') { log('global ←'); step(-1); }
  else if (e.key === 'ArrowRight') { log('global →'); step(1); }
  else if (e.key === 'i') A.showPanel('art');
  else if (e.key === 'Escape') { if (state.drawerOpen) closeDrawer(); else if (state.panel) A.showPanel('art'); }
});

// harness controls
$('#h-ch').addEventListener('change', e => { const [b, c] = e.target.value.split('.').map(Number); A.navigate(b, c, 0); });
$('#btn-prev').addEventListener('click', () => step(-1));
$('#btn-next').addEventListener('click', () => step(1));
$('#h-gallery').addEventListener('click', () => A.showPanel('art'));
$('#h-drawer').addEventListener('click', () => state.drawerOpen ? closeDrawer() : openDrawer());
$('#h-float').addEventListener('click', e => { art.setFloating(!art.floatingEnabled()); e.currentTarget.setAttribute('aria-pressed', String(art.floatingEnabled())); });
$('#h-place').addEventListener('click', e => { H.place = H.place === 'in' ? 'after' : 'in'; e.currentTarget.setAttribute('aria-pressed', String(H.place === 'in')); renderReader(); });
$('#h-notes').addEventListener('click', e => { H.notes = !H.notes; e.currentTarget.setAttribute('aria-pressed', String(H.notes)); renderReader(); });
const THEMES = ['auto', 'light', 'dark'];
$('#h-theme').addEventListener('click', e => {
  const cur = document.documentElement.dataset.theme || 'auto'; const nx = THEMES[(THEMES.indexOf(cur) + 1) % 3];
  if (nx === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = nx;
  e.currentTarget.textContent = 'Theme: ' + nx;
});

// ------------------------------------------------------------ boot
// URL states (for screenshots): ?theme=dark|light  ?place=in  ?notes  ?gallery[=nt|ot|book]  ?drawer
//   ?open=<plate id>[&zoom]  ?scrollto=<verse>  ?pick=<plate id>  ?selftest   #b/c[/v]
const Q = new URLSearchParams(location.search);
const wait = ms => new Promise(r => setTimeout(r, ms));
const frames = (n = 2) => document.hidden ? wait(40 * n) : new Promise(r => { const f = () => (--n <= 0 ? r() : requestAnimationFrame(f)); requestAnimationFrame(f); });
(async () => {
  if (Q.get('theme')) document.documentElement.dataset.theme = Q.get('theme');
  if (Q.get('place') === 'in') { H.place = 'in'; $('#h-place').setAttribute('aria-pressed', 'true'); }
  if (Q.has('notes')) { H.notes = true; $('#h-notes').setAttribute('aria-pressed', 'true'); }
  const meta = await data.meta(); state.meta = meta; state.books = meta.books; state.translations = meta.translations || [];
  art.init(A);
  await art.load();
  const sel = $('#h-ch');
  TEST.forEach(([b, c]) => sel.add(new Option(`${refLabel(b, c)} · ${art.forChapter(b, c).length}`, `${b}.${c}`)));
  const m = location.hash.match(/^#(\d+)\/(\d+)(?:\/(\d+))?/);
  if (m) { state.book = +m[1]; state.chapter = +m[2]; state.selected = m[3] ? +m[3] : null; } else { state.book = 1; state.chapter = 22; state.selected = null; }
  syncDrawer(); updateBar();
  await renderReader({ scroll: true });
  if (Q.has('drawer')) openDrawer();
  if (Q.has('gallery')) { A.showPanel('art', true); await frames(3); const f = Q.get('gallery'); if (f) $(`[data-art-f="${f}"]`)?.click(); }
  if (Q.get('pick')) { $(`#reader [data-art-pick="${Q.get('pick')}"]`)?.click(); }
  if (Q.get('scrollto')) { await wait(1200); document.getElementById('v' + Q.get('scrollto'))?.scrollIntoView({ block: 'center' }); }
  if (Q.get('open')) { await art.openViewer(Q.get('open')); if (Q.has('zoom')) { await wait(300); $('.art-viewer [data-av="in"]').click(); } }
  window.__ready = true;
  if (Q.has('selftest')) selftest();
})().catch(e => { console.error(e); $('#reader').textContent = 'Harness failed: ' + e.message; });

// ------------------------------------------------------------ automated self-test (?selftest)
async function selftest() {
  const pre = document.createElement('pre'); pre.id = 'selftest';
  pre.style.cssText = 'position:relative;z-index:1;white-space:pre-wrap;font:12px/1.4 ui-monospace,monospace;margin:20px;padding:16px;border-radius:12px;background:var(--bg-2);color:var(--label)';
  document.body.appendChild(pre);
  const R = []; const ok = (name, cond, info = '') => { R.push({ name, pass: !!cond, info: String(info) }); pre.dataset.progress = `${R.length} ${name}`; };
  const click = el => { if (!el) return false; el.click(); return true; };
  const key = (el, k) => el.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
  const viewer = () => $('dialog.art-viewer');
  const vOpen = () => !!viewer()?.open;
  try {
    // data + indexes
    ok('222 plates', art.plates().length === 222, art.plates().length);
    ok('Genesis 22 has art', art.forChapter(1, 22).length >= 1, art.forChapter(1, 22).map(p => p.id));
    ok('Romans 8 has none', art.forChapter(45, 8).length === 0 && art.heroHtml(45, 8) === '' && art.drawerHtml(45, 8, 0) === '');
    const m27 = art.forChapter(40, 27);
    ok('Matthew 27: 13 plates, primary refs first', m27.length === 13 && m27.findIndex(p => p.ref[0] !== 40 || p.ref[1] !== 27) >= m27.filter(p => p.ref[0] === 40 && p.ref[1] === 27).length, m27.map(p => p.id).join(' '));
    ok('forVerse Luke 15:20', art.forVerse(42, 15, 20).map(p => p.id).join() === 'dore-193,dore-194', art.forVerse(42, 15, 20).map(p => p.id).join());
    ok('forVerse outside any range is empty', art.forVerse(1, 22, 1).length === 0);
    ok('badge only on first verse', art.verseBadgeHtml(1, 22, 6).includes('class="art-badge"') && art.verseBadgeHtml(1, 22, 7) === '', art.verseBadgeHtml(1, 22, 6).slice(0, 80));
    ok('badge aria-label', /aria-label="Engraving: /.test(art.verseBadgeHtml(1, 22, 6)));
    ok('badge via also-range (Mark 15:17)', art.verseBadgeHtml(41, 15, 17).includes('data-art="dore-208"') || art.verseBadgeHtml(41, 15, 17).includes('data-art='), art.verseBadgeHtml(41, 15, 17).slice(0, 90));
    const TESTS = [[1, 22], [2, 14], [27, 6], [42, 15], [44, 9], [66, 21]];
    for (const [b, c] of TESTS) ok(`hero ${refLabel(b, c)}`, art.heroHtml(b, c).includes('class="art-hero'));
    ok('no large image requested before the viewer', !performance.getEntriesByType('resource').some(e => /\/art\/dore-\d+\.jpg$/.test(e.name)), performance.getEntriesByType('resource').filter(e => /\/art\/dore-\d+\.jpg$/.test(e.name)).map(e => e.name).join());

    // reader wiring
    A.navigate(1, 22, 0); await renderP; await frames(3);
    ok('hero rendered in the reader', !!$('#reader .hero > .art-hero'));
    ok('hero is after the chips, before the signature', $('#reader .hero > .chips')?.nextElementSibling?.classList.contains('art-hero') && $('#reader .art-hero').nextElementSibling?.classList.contains('sig'));
    ok('one badge in Genesis 22', $$('#reader .art-badge').length === 1 && !!$('#v6 .art-badge'));
    const imgs = $$('#reader .art-hero img, #reader .art-badge img');
    ok('images carry width/height (no layout shift)', imgs.every(i => i.getAttribute('width') && i.getAttribute('height')));
    ok('hero img alt = title + scene', ($('#reader .art-img')?.alt || '').length > 30, $('#reader .art-img')?.alt);
    LOG.length = 0;
    click($('#v6 .art-badge')); await wait(350);
    ok('badge click opens the viewer', vOpen());
    ok('badge click did not select the verse', !LOG.some(l => l.startsWith('reader-click') || l.startsWith('select')), LOG.join(' | '));
    ok('viewer counter', /^\d+ of 222$/.test($('.av-count')?.textContent || ''), $('.av-count')?.textContent);
    ok('viewer focus inside', viewer()?.contains(document.activeElement), document.activeElement?.className);
    ok('large image requested only now', performance.getEntriesByType('resource').some(e => /\/art\/dore-\d+\.jpg$/.test(e.name)));
    const t0 = $('.av-title').textContent;
    key(viewer(), 'ArrowRight'); await wait(60);
    ok('→ next plate', $('.av-title').textContent !== t0, $('.av-title').textContent);
    key(viewer(), 'ArrowLeft'); await wait(60);
    ok('← back', $('.av-title').textContent === t0);
    ok('global ← → not triggered while the viewer is open', !LOG.some(l => l.startsWith('global')), LOG.join(' | '));
    key(viewer(), '+'); await wait(40);
    ok('+ zooms', $('.av-shell').classList.contains('zoomed'));
    key(viewer(), '0'); await wait(40);
    ok('0 fits', !$('.av-shell').classList.contains('zoomed'));
    key(viewer(), 'i'); await wait(40);
    ok('i hides the caption', $('.av-shell').classList.contains('no-cap') && $('[data-av="info"]').getAttribute('aria-pressed') === 'false');
    key(viewer(), 'i'); await wait(40);
    ok('Commons link noopener', $('.av-credit a')?.rel === 'noopener' && $('.av-credit a')?.target === '_blank' && /^https:\/\/commons\.wikimedia\.org\//.test($('.av-credit a')?.href || ''));
    ok('full credit shown', /Gustave Doré/.test($('.av-credit').textContent) && /1866/.test($('.av-credit').textContent));
    // focus trap: Tab from the last control wraps to the first
    const foc = [...viewer().querySelectorAll('button, a[href]')].filter(el => !el.disabled && el.offsetParent !== null);
    foc[foc.length - 1].focus(); key(foc[foc.length - 1], 'Tab');
    ok('Tab wraps inside the viewer', viewer().contains(document.activeElement));
    click($('.art-viewer [data-av="close"]')); await wait(350);
    ok('close button closes', !vOpen());
    ok('focus returns to the badge', document.activeElement === $('#v6 .art-badge'), document.activeElement?.className);

    // hero verse-range pill
    LOG.length = 0;
    click($('#reader .art-range')); await wait(80);
    ok('range pill selects v6 without opening the sheet', LOG.some(l => l.startsWith('select 6 {"open":false}')), LOG.join(' | '));
    ok('range pill flashes 6–8', LOG.some(l => l.startsWith('flash [6,7,8]')), LOG.join(' | '));
    ok('range pill did not reach reader.js', !LOG.some(l => l.startsWith('reader-click')));

    // multi-plate chapter: strip swap
    A.navigate(40, 27, 0); await renderP; await frames(3);
    const picks = $$('#reader .art-pick');
    ok('Matthew 27 strip has 13 thumbnails', picks.length === 13, picks.length);
    const tA = $('#reader .art-title').textContent;
    click(picks[3]); await wait(400);
    ok('strip swaps the featured plate', $('#reader .art-title').textContent !== tA && picks[3].getAttribute('aria-pressed') === 'true' && $$('#reader .art-pick[aria-pressed="true"]').length === 1, $('#reader .art-title').textContent);
    ok('kicker shows 4 of 13', $('#reader .art-of').textContent === '4 of 13', $('#reader .art-of').textContent);
    ok('badges in Matthew 27', $$('#reader .art-badge').length >= 10, $$('#reader .art-badge').length);
    const firstV = id => { const p = art.plate(id); const rs = [p.ref, ...p.also].filter(r => r[0] === 40 && r[1] === 27); return Math.min(...rs.map(r => r[2])); };
    const order = picks.map(x => firstV(x.dataset.artPick));
    ok('strip is in verse order', order.every((x, i) => !i || order[i - 1] <= x), order.join(','));
    LOG.length = 0; picks[0].focus(); key(picks[0], 'ArrowRight'); await frames(1);
    ok('→ moves along the strip', document.activeElement === picks[1]);
    ok('→ in the strip does not turn the chapter', !LOG.some(l => l.startsWith('global')), LOG.join(' | '));
    ok('keyboard focus shows the preview', !!$('#art-pop.on') || !!$('#art-pop:not([hidden])'));
    picks[0].blur();
    // geometry: a badge never runs into the next verse (desktop metadata column)
    const geo = () => $$('#reader .art-badge').map(bd => { const ve = bd.closest('.verse'), nx = ve.nextElementSibling; const r = bd.getBoundingClientRect(); return { v: ve.dataset.v, over: r.bottom - ve.getBoundingClientRect().bottom, nxc: nx?.querySelector('.xc')?.getBoundingClientRect().top }; });
    const bad = g => g.filter(o => o.over > 1 || (o.nxc && o.over > -2 && o.nxc < o.over + 4));
    ok('badges stay inside their verse (Matthew 27)', !bad(geo()).length, JSON.stringify(bad(geo())));
    A.navigate(1, 1, 0); await renderP; await frames(3);
    ok('badges stay inside their verse (Genesis 1, single-line 1:1)', !bad(geo()).length && $$('#reader .art-badge').length >= 1, JSON.stringify(geo()));

    // drawer section
    A.navigate(42, 15, 0); await renderP; await frames(2);
    A.select(20); await frames(2);
    ok('drawer "In art" section', !!$('#drawer-body .art-sec'));
    ok('drawer rows for Luke 15:20 (in-verse first)', $$('#drawer-body .art-list > li:not([hidden])').length === 2 && $$('#drawer-body .in-verse').length === 2);
    click($('#drawer-body .art-cell')); await wait(350);
    ok('drawer row opens the viewer', vOpen());
    click($('.art-viewer [data-av="close"]')); await wait(350);
    A.navigate(40, 27, 0); await renderP; openDrawer(); await frames(2);
    const hidN = $$('#drawer-body .art-list > li[hidden]').length;
    ok('drawer chapter view shows 4 and hides the rest', $$('#drawer-body .art-list > li:not([hidden])').length === 4 && hidN === 9, hidN);
    click($('#drawer-body [data-art-more]')); await frames(1);
    ok('“Show all” reveals the rest', $$('#drawer-body .art-list > li[hidden]').length === 0);
    closeDrawer();

    // viewer passage button navigates and flashes
    A.navigate(1, 22, 0); await renderP;
    await art.openViewer('dore-001');
    LOG.length = 0;
    click($('.art-viewer .av-go')); await wait(900);
    ok('“Read …” navigates to Genesis 1', LOG.some(l => l.startsWith('navigate 1 1 1')), LOG.join(' | '));
    ok('… and flashes 1–5', LOG.some(l => l.startsWith('flash [1,2,3,4,5]')), LOG.join(' | '));
    ok('viewer closed after “Read …”', !vOpen());

    // gallery
    A.showPanel('art', true); await frames(3);
    ok('gallery rendered', $$('#stage .art-g-item').length === 222, $$('#stage .art-g-item').length);
    ok('gallery thumbnails are lazy', $$('#stage .art-g-img img').every(i => i.loading === 'lazy' && i.decoding === 'async'));
    ok('gallery has a stage title', $('#stage #stage-title')?.textContent === 'Engravings');
    ok('one roving tab stop', $$('#stage .art-g-item[tabindex="0"]').length === 1);
    click($('#stage [data-art-f="nt"]')); await frames(1);
    const nNT = art.plates().filter(p => p.ref[0] > 39).length;
    ok(`filter New → ${nNT}`, $$('#stage .art-g-item').length === nNT && $('#stage [data-art-f="nt"] .art-g-c').textContent === String(nNT), $$('#stage .art-g-item').length);
    click($('#stage [data-art-f="book"]')); await frames(1);
    ok('filter This book (Genesis)', $$('#stage .art-g-item').length === art.plates().filter(p => p.ref[0] === 1 || p.also.some(r => r[0] === 1)).length, $$('#stage .art-g-item').length);
    click($('#stage [data-art-f="all"]')); await frames(1);
    const first = $('#stage .art-g-item'); first.focus(); LOG.length = 0;
    key(first, 'ArrowRight'); await frames(1);
    ok('→ in the gallery moves focus', document.activeElement === $$('#stage .art-g-item')[1]);
    ok('→ in the gallery does not turn the chapter', !LOG.some(l => l.startsWith('global')), LOG.join(' | '));
    LOG.length = 0;
    const it = $('#stage .art-g-item[data-art-g="dore-236"]');
    click(it); await wait(400);
    ok('gallery item navigates (panel kept)', LOG.some(l => l.startsWith('navigate 66 1 9 {"panel":"art"}')), LOG.join(' | '));
    ok('gallery item opens the viewer', vOpen() && $('.av-title').textContent === 'John at Patmos');
    click($('.art-viewer [data-av="close"]')); await wait(350);
    ok('gallery kept its DOM after navigation (in place)', !!$('#stage .art-g-body[data-ready]') && $('#stage [data-art-f="book"] .art-g-bn').textContent === 'Revelation');
    A.showPanel('art'); await wait(620);

    // floating card
    A.navigate(42, 15, 0); await renderP; await wait(300);
    art.setFloating(true);
    document.getElementById('v20').scrollIntoView({ block: 'center' }); await wait(700);
    const card = $('.art-float');
    ok('floating card shows while Luke 15:18–24 is on screen', card && card.classList.contains('on') && getComputedStyle(card).visibility === 'visible', card?.className);
    ok('card names the passage', /Luke 15:/.test($('.af-k')?.textContent || ''), $('.af-k')?.textContent);
    art.setFloating(false); await wait(80);
    ok('setFloating(false) hides it', !card.classList.contains('on') && art.floatingEnabled() === false);
    art.setFloating(true); await wait(80);
    ok('setFloating(true) brings it back', card.classList.contains('on'));
    scrollTo({ top: 0 }); await wait(500);
    ok('hidden while the hero engraving is in view', !card.classList.contains('on'));
    document.getElementById('v20').scrollIntoView({ block: 'center' }); await wait(600);
    click($('.art-float .af-x')); await wait(100);
    ok('× dismisses for this chapter', !card.classList.contains('on') && LOG.some(l => l.startsWith('toast Engravings hidden')), LOG.slice(-2).join(' | '));
    click($('#toast .toast-act')); await wait(120);
    ok('Undo brings it back', card.classList.contains('on'));
    A.navigate(1, 22, 0); await renderP; await wait(200);
  } catch (e) { ok('selftest threw', false, e.stack || e.message); }
  pre.textContent = JSON.stringify({ pass: R.filter(r => r.pass).length, fail: R.filter(r => !r.pass).length, results: R }, null, 1);
  pre.dataset.done = '1';
  window.__selftest = R;
}
</script>
</body>
</html>
